<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoClips</title>
<style>
  :root { --fondo: #0f1115; --panel: #181b22; --borde: #2a2f3a; --texto: #e8eaf0; --suave: #9aa3b2;
          --acento: #ff4d6d; --acento2: #ff8a3d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--borde);
         border-radius: 14px; padding: 24px; }
  h1 { margin: 0 0 16px; font-size: 1.6rem; }
  h1 span { background: linear-gradient(90deg, var(--acento), var(--acento2));
            -webkit-background-clip: text; background-clip: text; color: transparent; }
  input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--borde);
          background: #0d0f13; color: var(--texto); font-size: 1rem; }
  button { margin-top: 14px; width: 100%; padding: 12px; font-size: 1.05rem; font-weight: 700; border: 0;
           border-radius: 12px; color: #fff; cursor: pointer;
           background: linear-gradient(90deg, var(--acento), var(--acento2)); }
  .error { color: #ff6b6b; margin-top: 10px; }
</style>
</head>
<body>
  <form method="post" action="entrar">
    <h1>✂️ <span>AutoClips</span></h1>
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave" autofocus autocomplete="current-password">
    <button type="submit">Entrar</button>
    {% if error %}<div class="error">Contraseña incorrecta.</div>{% endif %}
  </form>
</body>
</html>
