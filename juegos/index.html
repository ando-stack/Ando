<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade del Recreo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: cuaderno cuadriculado; cabecera fija con perfil, pantallas apiladas, tarjetas tipo pegatina por juego */
:root{
  --paper:#f5f8fc; --grid:#dbe6f3; --ink:#1a2333; --ink-soft:#56627a; --card:#ffffff; --line:#c9d6e6;
  --accent:#2f5bea; --accent-ink:#ffffff; --good:#14915a; --bad:#d8433b; --gold:#e0a106;
  --c1:#ff7a59; --c2:#2f5bea; --c3:#14a37f; --c4:#b14fd6; --c5:#f2b705; --c6:#e04a8b; --c7:#1aa3c7; --c8:#6c7a12;
  --shadow:0 3px 0 var(--line);
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1a2c; --grid:#18294270; --ink:#e7eef9; --ink-soft:#9fb0c9; --card:#16233a; --line:#2a3d5c;
  --accent:#6f93ff; --accent-ink:#0b1424; --good:#3fd08f; --bad:#ff6b62; --gold:#ffc83d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f1a2c; --grid:#18294270; --ink:#e7eef9; --ink-soft:#9fb0c9; --card:#16233a; --line:#2a3d5c;
  --accent:#6f93ff; --accent-ink:#0b1424; --good:#3fd08f; --bad:#ff6b62; --gold:#ffc83d; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-body);font-size:16px;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
header.top .in{max-width:1040px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo b{background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:6px;transform:rotate(-3deg);display:inline-block}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}
.chip.btn:hover{border-color:var(--accent)}
.lvlbar{width:70px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.lvlbar i{display:block;height:100%;background:var(--accent)}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:800;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.ghost{border-color:var(--line);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.screen{padding-top:24px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.grid{display:grid;gap:16px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.big-title{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.03em}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:20px}
.mode{text-align:left;border:2px solid var(--ink);border-radius:18px;padding:18px;background:var(--card);box-shadow:0 4px 0 var(--ink);display:grid;gap:6px;min-height:140px;transition:transform .1s}
.mode:hover{transform:translateY(-2px) rotate(-.4deg)}
.mode .ico{font-size:2rem}
.mode h3{font-size:1.3rem}
.mode.story{background:var(--c4);color:#fff;border-color:var(--ink)}
.mode.free{background:var(--c3);color:#fff}
.mode.duel{background:var(--c1);color:#fff}
.mode.isla{background:var(--c7);color:#fff}
.mode.daily{background:var(--c5);color:#1a2333}
.mode p{margin:0;font-size:.95rem;opacity:.95}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gcard{border:2px solid var(--line);border-radius:16px;background:var(--card);padding:16px;display:grid;gap:10px;text-align:left}
.gcard .head{display:flex;gap:12px;align-items:center}
.gcard .badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;flex:none;border:2px solid var(--ink);transform:rotate(-4deg)}
.gcard h3{font-size:1.15rem}
.gcard p{margin:0;font-size:.92rem;color:var(--ink-soft)}
.difs{display:flex;gap:6px;flex-wrap:wrap}
.best{font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 18px}

/* historia */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.chap{position:relative;text-align:left;border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:16px;display:grid;gap:8px;box-shadow:0 4px 0 var(--ink)}
.chap.locked{border-style:dashed;border-color:var(--line);box-shadow:none;opacity:.7;cursor:not-allowed}
.chap .n{font-family:var(--f-display);font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.chap h3{font-size:1.15rem}
.stars{letter-spacing:2px;font-size:1.1rem}
.stars .on{color:var(--gold)} .stars .off{color:var(--line)}
.story-box{max-width:680px;margin:0 auto;display:grid;gap:16px}
.story-box p{font-size:1.15rem;line-height:1.6;margin:0}
.speaker{display:flex;gap:12px;align-items:flex-start}
.speaker .av{font-size:2.2rem;flex:none}
.bubble{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;position:relative}

/* juego */
.gamebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.gamebar h2{font-size:1.5rem}
.hud{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hud .chip{font-size:1.05rem}
.goal{font-weight:800;color:var(--ink-soft);font-size:.95rem}
.stage{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;min-height:380px;position:relative;overflow:hidden}
.center{display:grid;place-items:center;text-align:center;gap:16px}
.qbig{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,9vw,4.5rem);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(520px,100%)}
.opt{border:2px solid var(--ink);border-radius:14px;background:var(--paper);padding:16px;font-size:1.5rem;font-weight:800;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.opt.txt{font-size:1.05rem;text-align:left}
.opt.ok{background:var(--good);color:#fff;border-color:var(--good)}
.opt.ko{background:var(--bad);color:#fff;border-color:var(--bad)}
.combo{font-weight:800;color:var(--c1);min-height:1.4em}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:52px;height:58px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-family:var(--f-display);font-weight:800;font-size:1.6rem;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.tile.used{visibility:hidden}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:62px}
.slot{width:44px;height:54px;border-bottom:4px solid var(--ink-soft);font-family:var(--f-display);font-weight:800;font-size:1.6rem;display:grid;place-items:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
.mem{display:grid;gap:10px;width:min(500px,100%);margin:0 auto}
.card{aspect-ratio:1;border-radius:12px;border:2px solid var(--ink);background:var(--accent);font-size:clamp(1.4rem,6vw,2.4rem);display:grid;place-items:center;transition:transform .25s,background .2s;box-shadow:0 3px 0 var(--ink);max-width:100%}
.card span{opacity:0;transition:opacity .15s;grid-area:1/1}
.card::before{content:"?";grid-area:1/1;color:#fff;font-family:var(--f-display);font-weight:800;opacity:.85}
.card.open::before{content:""}
.card.open{background:var(--paper);transform:rotateY(180deg)}
.card.open span{opacity:1;transform:rotateY(180deg)}
.card.done{background:color-mix(in srgb,var(--good) 25%,var(--paper));border-color:var(--good)}
.arena{position:absolute;inset:0;cursor:crosshair}
.target{position:absolute;border-radius:50%;border:0;padding:0;display:grid;place-items:center;font-size:1.4rem;
  background:radial-gradient(circle,#fff 0 18%,var(--c1) 19% 40%,#fff 41% 58%,var(--c1) 59%);box-shadow:0 3px 0 rgba(0,0,0,.25);animation:grow .2s}
.target.gold{background:radial-gradient(circle,#fff 0 18%,var(--gold) 19% 40%,#fff 41% 58%,var(--gold) 59%)}
.target.bomb{background:var(--ink);color:var(--paper)}
@keyframes grow{from{transform:scale(0)}}
.float{position:absolute;font-weight:800;pointer-events:none;animation:up .7s forwards;font-family:var(--f-display)}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
canvas.snake{display:block;margin:0 auto;border:2px solid var(--ink);border-radius:10px;max-width:100%;touch-action:none;background:var(--paper)}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px}
.pad button{height:52px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-size:1.3rem;font-weight:800}
.simon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(380px,100%);margin:0 auto}
.simon button{aspect-ratio:1;border-radius:22px;border:3px solid var(--ink);opacity:.55;transition:opacity .1s,transform .1s;max-width:100%}
.simon button.lit{opacity:1;transform:scale(1.04)}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px;margin:0 auto}
.kb button{width:42px;height:46px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);font-weight:800;font-size:1.1rem}
.kb button.ok{background:var(--good);color:#fff;border-color:var(--good)}
.kb button.ko{background:var(--bad);color:#fff;border-color:var(--bad);opacity:.6}
.hearts{font-size:1.4rem;letter-spacing:3px}
.timerbar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;width:min(520px,100%)}
.timerbar i{display:block;height:100%;background:var(--c1);transition:width .2s linear}

/* equipos */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.team{border:3px solid var(--ink);border-radius:18px;padding:14px;text-align:center;display:grid;gap:8px}
.team input{font:inherit;font-weight:800;text-align:center;border:0;background:transparent;font-family:var(--f-display);font-size:1.3rem;width:100%;color:inherit}
.team .pts{font-family:var(--f-display);font-weight:800;font-size:3.4rem;font-variant-numeric:tabular-nums}
.team.a{background:color-mix(in srgb,var(--c2) 18%,var(--card))} .team.b{background:color-mix(in srgb,var(--c1) 20%,var(--card))}
.teamq{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,4.5vw,2.6rem);text-align:center}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,28,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:24px;max-width:460px;width:100%;display:grid;gap:14px;text-align:center;box-shadow:0 6px 0 var(--ink);max-height:90vh;overflow:auto}
.modal .score{font-family:var(--f-display);font-weight:800;font-size:3.6rem;font-variant-numeric:tabular-nums;line-height:1}
.rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.newach{background:color-mix(in srgb,var(--gold) 22%,var(--card));border:2px solid var(--gold);border-radius:12px;padding:8px 12px;font-weight:800}

/* perfil / tienda */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ach{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;background:var(--card)}
.ach .i{font-size:1.8rem;filter:grayscale(1);opacity:.45}
.ach.got{border-color:var(--gold)} .ach.got .i{filter:none;opacity:1}
.ach b{display:block} .ach small{color:var(--ink-soft)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:grid;gap:6px;justify-items:center;text-align:center}
.item .e{font-size:2.4rem}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pcard{border:2px solid var(--ink);border-radius:16px;padding:16px;background:var(--card);display:grid;gap:4px;justify-items:center;box-shadow:0 3px 0 var(--ink)}
.pcard .e{font-size:2.6rem}
.field{display:grid;gap:6px;text-align:left}
.field input,.field textarea{font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink);width:100%}
.avpick{display:flex;gap:8px;flex-wrap:wrap}
.avpick button{font-size:1.8rem;border:2px solid var(--line);background:var(--paper);border-radius:12px;width:54px;height:54px}
.avpick button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--paper))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.stat b{font-family:var(--f-display);font-size:1.6rem;display:block;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:800;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.tile{width:44px;height:50px;font-size:1.35rem}.kb button{width:34px;height:42px}.opt{font-size:1.25rem;padding:12px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="logo" id="goHome" aria-label="Inicio"><b>Arcade</b> del Recreo</button>
  <div class="chips" id="chips"></div>
</div></header>
<main class="wrap" id="app"></main>

<script>
"use strict";
/* ============ utilidades ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const app=$('#app');
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ============ sonido ============ */
let AC=null;
function beep(f=440,d=.1,type='sine',v=.08){
  if(!DB.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.02);}catch(e){}
}
const sfx={ok:()=>{beep(660,.08);setTimeout(()=>beep(880,.1),70)},ko:()=>beep(180,.2,'square',.05),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*110)),tick:()=>beep(1200,.03,'square',.02)};

/* ============ guardado ============ */
const KEY='arcade-recreo-v1';
let DB;
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  if(!DB||typeof DB!=='object'||!DB.profiles)DB={profiles:{},current:null,sound:true};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const P=()=>DB.profiles[DB.current];
function newProfile(name,avatar){
  const id='p'+Date.now().toString(36);
  DB.profiles[id]={id,name,avatar,xp:0,coins:30,owned:[avatar],best:{},story:{done:0,stars:{}},ach:[],played:0,dailyDone:null,dailyCount:0,stats:{}};
  DB.current=id;save();
}
const levelOf=xp=>Math.floor(Math.sqrt(xp/60))+1;
const xpFor=l=>(l-1)*(l-1)*60;

/* ============ catálogo ============ */
const DIFS={facil:'Fácil',normal:'Normal',dificil:'Difícil'};
const AVATARS_FREE=['🦊','🐸','🐼','🐙','🦉','🐢'];
const SHOP=[['🦖',60],['🐲',80],['🦄',80],['🤖',100],['👽',100],['🧙',120],['🦸',140],['🐯',60],['🐧',50],['🦈',90],['🐝',50],['🦩',70],['🧛',150],['🥷',160],['👑',300],['🌈',200]];

const WORDS={
  'Escuela':['ESCUELA','CUADERNO','PIZARRA','MOCHILA','RECREO','REGLA','GOMA','TIZA','PUPITRE','ESTUCHE','PROFESORA','EXAMEN','DEBERES','PATIO','AGENDA'],
  'Animales':['ELEFANTE','JIRAFA','TORTUGA','PINGUINO','CABALLO','MARIPOSA','COCODRILO','ARDILLA','DELFIN','CANGURO','LORO','BALLENA','HORMIGA','PULPO','LECHUZA'],
  'Naturaleza':['MONTAÑA','BOSQUE','RIO','VOLCAN','PLANETA','ESTRELLA','NUBE','OCEANO','DESIERTO','SELVA','CASCADA','ISLA','TORMENTA','ARCOIRIS','GLACIAR'],
  'Comida':['MANZANA','TORTILLA','PAELLA','BOCADILLO','NARANJA','GALLETA','PLATANO','SANDIA','QUESO','CEREZA','HELADO','ZANAHORIA','PIMIENTO','CHURRO','YOGUR'],

let RUN=null;
function makeCtx(stage,hud,opts){
  const timers=[],listeners=[];
  const c={stage,dif:opts.dif,goal:opts.goal,ended:false,
    every(ms,fn){const id=setInterval(fn,ms);timers.push(()=>clearInterval(id));return ()=>clearInterval(id)},
    after(ms,fn){const id=setTimeout(fn,ms);timers.push(()=>clearTimeout(id));return id},
    on(t,ev,fn,o){t.addEventListener(ev,fn,o);listeners.push(()=>t.removeEventListener(ev,fn,o))},
    hud(k,v){let el=hud.querySelector(`[data-k="${k}"]`);if(!el){el=document.createElement('span');el.className='chip';el.dataset.k=k;hud.appendChild(el)}el.textContent=v},
    float(x,y,txt,color){const f=document.createElement('div');f.className='float';f.style.left=x+'px';f.style.top=y+'px';f.style.color=color||'var(--ink)';f.textContent=txt;stage.appendChild(f);setTimeout(()=>f.remove(),700)},
    end(res){if(c.ended)return;c.ended=true;c.cleanup();opts.onEnd(res)},
    cleanup(){timers.forEach(f=>f());listeners.forEach(f=>f());timers.length=0;listeners.length=0}
  };
  return c;
}
function countdown(c,secs,onDone){let t=secs;c.hud('time','⏱ '+t);
  c.every(1000,()=>{t--;c.hud('time','⏱ '+Math.max(0,t));if(t<=5&&t>0)sfx.tick();if(t<=0)onDone()});
  return {add(n){t+=n;c.hud('time','⏱ '+Math.max(0,t))},get left(){return t}};
}

/* ---------- 1. Cálculo relámpago ---------- */
calc:{name:'Cálculo Relámpago',icon:'➗',color:'var(--c2)',desc:'Resuelve cuentas antes de que acabe el tiempo. Las rachas multiplican puntos.',goal:120,unit:'puntos',
run(c){
  let score=0,combo=0,maxC=0,correct=0,ans=0,lock=false;
  c.stage.innerHTML=`<div class="center" style="min-height:340px"><div class="combo" id="cb"></div><div class="qbig" id="q"></div><div class="opts" id="o"></div><p class="muted">Teclas 1 a 4 también valen. Fallar resta 3 segundos.</p></div>`;
  const T=countdown(c,{facil:60,normal:45,dificil:40}[c.dif],()=>c.end({score,stats:{correct,maxCombo:maxC}}));
  c.hud('score','⭐ 0');
  function gen(){
    const d=c.dif;let a,b,op;
    const ops=d==='facil'?['+','−']:d==='normal'?['+','−','×']:['+','−','×','÷'];
    op=pick(ops);const M=d==='facil'?20:d==='normal'?50:100;
    if(op==='+'){a=rnd(1,M);b=rnd(1,M);ans=a+b}
    else if(op==='−'){a=rnd(2,M);b=rnd(1,a);ans=a-b}
    else if(op==='×'){const X=d==='normal'?10:12;a=rnd(2,X);b=rnd(2,X);ans=a*b}
    else{b=rnd(2,12);ans=rnd(2,12);a=b*ans}
    $('#q',c.stage).textContent=`${a} ${op} ${b}`;
    const set=new Set([ans]);while(set.size<4){const v=ans+rnd(-10,10);if(v>=0)set.add(v)}
    const o=$('#o',c.stage);o.innerHTML='';
    shuffle([...set]).forEach((v,i)=>{const bt=document.createElement('button');bt.className='opt';bt.textContent=v;bt.dataset.v=v;bt.onclick=()=>choose(bt);o.appendChild(bt)});
    lock=false;
  }
  function choose(bt){if(lock||c.ended)return;lock=true;
    if(+bt.dataset.v===ans){combo++;maxC=Math.max(maxC,combo);correct++;score+=10+Math.min(combo,10)*2;bt.classList.add('ok');sfx.ok()}
    else{combo=0;T.add(-3);bt.classList.add('ko');$$('.opt',c.stage).find(x=>+x.dataset.v===ans).classList.add('ok');sfx.ko()}
    c.hud('score','⭐ '+score);$('#cb',c.stage).textContent=combo>=3?`¡Racha x${combo}! 🔥`:'';
    c.after(combo?250:600,gen);
  }
  c.on(document,'keydown',e=>{const n=+e.key;if(n>=1&&n<=4){const b=$$('.opt',c.stage)[n-1];b&&choose(b)}});
  gen();
}},
/* ---------- 2. Palabras revueltas ---------- */
palabras:{name:'Letras Revueltas',icon:'🔤',color:'var(--c3)',desc:'Ordena las letras para formar la palabra escondida. Pista: la categoría.',goal:60,unit:'puntos',
run(c){
  let score=0,solved=0,word,cat,tiles,built=[];
  const pool=ALL_WORDS.filter(x=>c.dif==='facil'?x.w.length<=6:c.dif==='normal'?x.w.length<=8:x.w.length>=6);
  c.stage.innerHTML=`<div class="center" style="min-height:340px;align-content:center"><div class="eyebrow" id="cat"></div><div class="slots" id="sl"></div><div class="tiles" id="tl"></div>
   <div class="row"><button class="btn ghost sm" id="undo">↩ Borrar</button><button class="btn ghost sm" id="skip">Saltar (−5 s)</button></div></div>`;
  const T=countdown(c,{facil:75,normal:60,dificil:60}[c.dif],()=>c.end({score,stats:{solved}}));
  c.hud('score','⭐ 0');
  function next(){const it=pick(pool);word=it.w;cat=it.c;let s;do{s=shuffle(word.split(''))}while(s.join('')===word&&word.length>1);tiles=s;built=[];draw()}
  function draw(){
    $('#cat',c.stage).textContent='Categoría: '+cat+' · '+word.length+' letras';
    $('#sl',c.stage).innerHTML=word.split('').map((_,i)=>`<div class="slot">${built[i]!=null?tiles[built[i]]:''}</div>`).join('');
    const tl=$('#tl',c.stage);tl.innerHTML='';
    tiles.forEach((ch,i)=>{const b=document.createElement('button');b.className='tile'+(built.includes(i)?' used':'');b.textContent=ch;b.onclick=()=>add(i);tl.appendChild(b)});
  }
  function add(i){if(built.includes(i))return;built.push(i);beep(500+built.length*40,.05);draw();
    if(built.length===word.length){const g=built.map(j=>tiles[j]).join('');
      if(g===word){score+=word.length*5;solved++;c.hud('score','⭐ '+score);sfx.ok();$('#sl',c.stage).classList.add('pop');c.after(350,next)}
      else{sfx.ko();$('#sl',c.stage).classList.add('shake');c.after(400,()=>{built=[];draw()})}}}
  $('#undo',c.stage).onclick=()=>{built.pop();draw()};
  $('#skip',c.stage).onclick=()=>{T.add(-5);toast('Era: '+word);next()};
  c.on(document,'keydown',e=>{if(e.key==='Backspace'){built.pop();draw();return}
    const k=e.key.toUpperCase();const i=tiles.findIndex((ch,j)=>ch===k&&!built.includes(j));if(i>=0)add(i)});
  next();
}},

/* ---------- 5. Serpiente ---------- */
serpiente:{name:'Serpiente Glotona',icon:'🐍',color:'var(--c8)',desc:'Come manzanas y crece sin chocar. Flechas, WASD o desliza el dedo.',goal:60,unit:'puntos',
run(c){
  const N=18;const w=Math.min(c.stage.clientWidth-40,440);const cs=Math.floor(w/N);
  c.stage.innerHTML=`<canvas class="snake" width="${cs*N}" height="${cs*N}"></canvas>
    <div class="pad"><span></span><button data-d="u" aria-label="Arriba">▲</button><span></span><button data-d="l" aria-label="Izquierda">◀</button><button data-d="d" aria-label="Abajo">▼</button><button data-d="r" aria-label="Derecha">▶</button></div>`;
  const cv=$('canvas',c.stage),g=cv.getContext('2d');
  const css=getComputedStyle(document.documentElement);const col=v=>css.getPropertyValue(v).trim();
  let sn=[{x:8,y:9},{x:7,y:9},{x:6,y:9}],dir={x:1,y:0},nd=dir,food,score=0,apples=0;
  const wrap=c.dif==='facil';
  const D={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};
  function place(){do{food={x:rnd(0,N-1),y:rnd(0,N-1)}}while(sn.some(s=>s.x===food.x&&s.y===food.y))}
  function turn(k){const d=D[k];if(!d)return;if(d.x===-dir.x&&d.y===-dir.y)return;nd=d}
  place();c.hud('score','🍎 0');
  function draw(){g.fillStyle=col('--paper');g.fillRect(0,0,cv.width,cv.height);
    g.fillStyle=col('--grid');for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)g.fillRect(i*cs,j*cs,cs,cs);
    g.font=`${cs*.85}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('🍎',food.x*cs+cs/2,food.y*cs+cs/2+1);
    sn.forEach((s,i)=>{g.fillStyle=i===0?col('--c8'):col('--c3');g.beginPath();g.roundRect(s.x*cs+1,s.y*cs+1,cs-2,cs-2,cs/3);g.fill()});}
  function step(){dir=nd;let h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(wrap){h.x=(h.x+N)%N;h.y=(h.y+N)%N}
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y)){sfx.ko();draw();return c.end({score,stats:{apples}})}
    sn.unshift(h);if(h.x===food.x&&h.y===food.y){apples++;score+=10;c.hud('score','🍎 '+apples+' · ⭐ '+score);sfx.ok();place()}else sn.pop();draw()}
  draw();
  const sp={facil:150,normal:115,dificil:85}[c.dif];
  let cur=sp;let stop=c.every(cur,tick);
  function tick(){step();const want=Math.max(55,sp-apples*3);if(want!==cur&&!c.ended){cur=want;stop();stop=c.every(cur,tick)}}
  c.on(document,'keydown',e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'}[e.key];if(m){e.preventDefault();turn(m)}});
  $$('.pad button',c.stage).forEach(b=>b.onclick=()=>turn(b.dataset.d));
  let sx,sy;c.on(cv,'touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  c.on(cv,'touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))});
}},

secuencia:{name:'Eco de Colores',icon:'🎵',color:'var(--c7)',desc:'Mira y escucha la secuencia, luego repítela. Cada ronda añade un paso más.',goal:60,unit:'puntos',

  function next(){round++;c.hud('score','🔁 Ronda '+round);seq.push(rnd(0,3));if(c.dif==='dificil'&&round===1)seq.push(rnd(0,3));

    pos++;if(pos===seq.length){input=false;$('#st',c.stage).textContent='¡Bien!';c.after(700,next)}}

globo:{name:'Salva el Globo',icon:'🎈',color:'var(--c5)',desc:'Adivina la palabra letra a letra. Cada fallo desinfla el globo. Tres palabras por partida.',goal:60,unit:'puntos',
run(c){
  const lives0={facil:8,normal:6,dificil:5}[c.dif];let round=0,score=0,solvedN=0,word,cat,guessed,lives;
  const AB='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
  c.stage.innerHTML=`<div class="center" style="min-height:340px;align-content:center"><div style="font-size:4rem;line-height:1" id="bal">🎈</div><div class="hearts" id="hp"></div><div class="eyebrow" id="cat"></div><div class="slots" id="sl"></div><div class="kb" id="kb"></div></div>`;
  function start(){round++;if(round>3)return c.end({score,stats:{solved:solvedN}});
    const pool=ALL_WORDS.filter(x=>c.dif==='dificil'?x.w.length>=7:x.w.length<=9);
    const it=pick(pool);word=it.w;cat=it.c;guessed=new Set();lives=lives0;c.hud('n',`🎈 ${round}/3`);
    const kb=$('#kb',c.stage);kb.innerHTML='';AB.forEach(l=>{const b=document.createElement('button');b.textContent=l;b.dataset.l=l;b.onclick=()=>guess(l);kb.appendChild(b)});draw()}
  function draw(){$('#cat',c.stage).textContent='Categoría: '+cat;
    $('#sl',c.stage).innerHTML=word.split('').map(ch=>`<div class="slot">${guessed.has(ch)?ch:''}</div>`).join('');
    $('#hp',c.stage).textContent='❤️'.repeat(lives)+'🤍'.repeat(lives0-lives);
    $('#bal',c.stage).style.transform=`scale(${.45+.55*lives/lives0})`;c.hud('score','⭐ '+score)}
  function guess(l){if(guessed.has(l)||lives<=0)return;guessed.add(l);const b=$(`#kb [data-l="${l}"]`,c.stage);
    if(word.includes(l)){b.classList.add('ok');sfx.ok()}else{b.classList.add('ko');lives--;sfx.ko()}
    b.disabled=true;draw();
    if(word.split('').every(ch=>guessed.has(ch))){score+=20+lives*5;solvedN++;draw();$('#bal',c.stage).textContent='🎈';toast('¡Acertaste!');c.after(900,start)}
    else if(lives<=0){$('#bal',c.stage).textContent='💥';toast('Era: '+word);c.after(1300,()=>{$('#bal',c.stage).textContent='🎈';start()})}}
  c.on(document,'keydown',e=>{const k=e.key.toUpperCase();if(AB.includes(k))guess(k)});
  start();
}},

    else if(Math.random()<.3){const it=pick(ALL_WORDS);let s;do{s=shuffle(it.w.split('')).join('')}while(s===it.w);cur={c:'Palabra revuelta · '+it.c,q:s,a:it.w}}
    else{const t=pick(TRIVIA);cur={c:t[0],q:t[1]+'  ·  '+shuffle(t[2]).join(' / '),a:t[2][0]}}
    $('#qc').textContent=cur.c;$('#qq').textContent=cur.q;beep(700,.08)}
  function showA(){if(!cur)return;shown=true;$('#qa').textContent='✔ '+cur.a}
  function point(t){if(t==='a')sa++;else sb++;$('#pa').textContent=sa;$('#pb').textContent=sb;sfx.ok();
    const tg=+$('#tg').value;if(sa>=tg||sb>=tg){sfx.win();const name=sa>=tg?$('#na').value:$('#nb').value;
      const p=P();p.played++;p.xp+=40;p.coins+=20;const nw=checkAchs(p);save();renderChips();
      modal(`<div style="font-size:3rem">🏆</div><h2>¡Gana ${esc(name)}!</h2><p class="score">${sa} – ${sb}</p><p class="muted">+40 XP y +20 🪙 para ${esc(p.name)} por organizar el duelo.</p>${nw.map(a=>`<div class="newach">${a.i} Logro: ${a.n}</div>`).join('')}<div class="row"><button class="btn primary" data-x="again">Otra partida</button><button class="btn ghost" data-x="home">Inicio</button></div>`,
        {again:()=>go('equipos'),home:()=>go('home')})}}
  $('#ba').onclick=()=>point('a');$('#bb').onclick=()=>point('b');$('#nq').onclick=newQ;$('#sh').onclick=showA;
  $('#rs').onclick=()=>{sa=sb=0;$('#pa').textContent=0;$('#pb').textContent=0};$('#bk').onclick=()=>go('home');
  const c=makeCtx(app,document.createElement('div'),{});RUN=c;
  c.on(document,'keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
    if(k==='a')point('a');else if(k==='l')point('b');else if(k===' '){e.preventDefault();newQ()}else if(k==='r')showA()});
},
perfil(){
  const p=P();const l=levelOf(p.xp);
  const rows=GAME_IDS.map(id=>{const b=p.best[id]||{};return `<tr><td>${GAMES[id].icon} ${GAMES[id].name}</td>${Object.keys(DIFS).map(d=>`<td>${b[d]??'—'}</td>`).join('')}</tr>`}).join('');
  app.innerHTML=`<section class="screen grid"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span style="font-size:3.4rem">${p.avatar}</span><div><div class="eyebrow">Perfil</div><h1 class="big-title" style="font-size:2.2rem">${esc(p.name)}</h1></div></div>
   <div class="stats"><div class="stat"><span class="muted">Nivel</span><b>${l}</b></div><div class="stat"><span class="muted">Experiencia</span><b>${p.xp}</b></div><div class="stat"><span class="muted">Monedas</span><b>${p.coins}</b></div><div class="stat"><span class="muted">Partidas</span><b>${p.played}</b></div><div class="stat"><span class="muted">Estrellas</span><b>${totalStars(p)}</b></div><div class="stat"><span class="muted">Retos del día</span><b>${p.dailyCount}</b></div></div>
   <div class="panel"><h3 style="margin-bottom:8px">Récords</h3><div class="tbl"><table><thead><tr><th>Juego</th><th>Fácil</th><th>Normal</th><th>Difícil</th></tr></thead><tbody>${rows}</tbody></table></div></div>
   <div><h3 style="margin-bottom:10px">Logros · ${p.ach.length}/${ACHS.length}</h3><div class="achs">${ACHS.map(([id,i,n,d])=>`<div class="ach ${p.ach.includes(id)?'got':''}"><span class="i">${i}</span><div><b>${n}</b><small>${d}</small></div></div>`).join('')}</div></div>
   <div class="panel grid"><h3>Copia de seguridad</h3><p class="muted" style="margin:0">Si el ordenador del cole borra los datos, guarda este código y pégalo otro día para recuperar tu partida.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="exp">📋 Copiar mi código</button></div>
    <div class="field"><label for="imp">Pegar un código guardado</label><textarea id="imp" rows="3" placeholder="Pega aquí tu código"></textarea></div>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="impB">Recuperar partida</button><button class="btn ghost" id="del" style="color:var(--bad)">Borrar este jugador</button></div></div></section>`;
  const code=()=>btoa(unescape(encodeURIComponent(JSON.stringify(p))));
  $('#exp').onclick=()=>{const t=code();navigator.clipboard.writeText(t).then(()=>toast('Código copiado'),()=>{$('#imp').value=t;$('#imp').select();toast('Selecciona y copia el código del cuadro')})};
  $('#impB').onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));if(!d||!d.name||!d.story)throw 0;
    d.id=d.id||('p'+Date.now().toString(36));DB.profiles[d.id]=d;DB.current=d.id;save();toast('Partida de '+d.name+' recuperada');go('home')}catch(e){toast('Ese código no es válido. Revisa que esté completo.')}};
  $('#del').onclick=()=>modal(`<h2>¿Borrar a ${esc(p.name)}?</h2><p class="muted">Se perderán su historia, récords y monedas. No se puede deshacer.</p><div class="row"><button class="btn" data-x="no">Cancelar</button><button class="btn primary" style="background:var(--bad);border-color:var(--bad)" data-x="yes">Sí, borrar</button></div>`,
    {no:()=>closeModal(),yes:()=>{delete DB.profiles[p.id];DB.current=Object.keys(DB.profiles)[0]||null;save();go('home')}});
},
tienda(){
  const p=P();
  const all=[...AVATARS_FREE.map(e=>[e,0]),...SHOP];
  app.innerHTML=`<section class="screen"><div class="eyebrow">Tienda · tienes 🪙 ${p.coins}</div><h1 class="big-title" style="font-size:2.2rem">Avatares</h1>
   <p class="muted">Gana monedas jugando: una por cada 10 puntos, y extra en la historia y el reto del día.</p>
   <div class="shop">${all.map(([e,cost])=>{const own=p.owned.includes(e)||cost===0;return `<div class="item ${p.avatar===e?'sel':''}"><span class="e">${e}</span>
    ${p.avatar===e?'<span class="muted">En uso</span>':own?`<button class="btn sm" data-use="${e}">Usar</button>`:`<button class="btn sm primary" data-buy="${e}" data-c="${cost}" ${p.coins<cost?'disabled':''}>🪙 ${cost}</button>`}</div>`}).join('')}</div></section>`;
  $$('[data-use]',app).forEach(b=>b.onclick=()=>{p.avatar=b.dataset.use;if(!p.owned.includes(p.avatar))p.owned.push(p.avatar);save();go('tienda')});
  $$('[data-buy]',app).forEach(b=>b.onclick=()=>{const c=+b.dataset.c;if(p.coins<c)return;p.coins-=c;p.owned.push(b.dataset.buy);p.avatar=b.dataset.buy;sfx.win();
    const nw=checkAchs(p);save();nw.forEach(a=>toast('Logro: '+a.n));go('tienda')});
},
perfiles(){
  const ps=Object.values(DB.profiles);let av=AVATARS_FREE[0];
  app.innerHTML=`<section class="screen grid">${ps.length?`<div><div class="eyebrow">¿Quién juega?</div><h1 class="big-title" style="font-size:2.2rem">Elige jugador</h1></div>
   <div class="profiles">${ps.map(x=>`<button class="pcard" data-id="${x.id}"><span class="e">${x.avatar}</span><b>${esc(x.name)}</b><span class="muted">Nv ${levelOf(x.xp)} · ⭐ ${totalStars(x)}</span></button>`).join('')}</div>`
   :`<div><div class="eyebrow">Bienvenida</div><h1 class="big-title">Arcade del Recreo</h1><p class="muted" style="max-width:56ch">Crea tu jugador para guardar tu historia, tus récords y tus monedas. Si compartes ordenador, cada persona puede tener su perfil.</p></div>`}
   <form class="panel grid" id="nf" style="max-width:520px"><h3>Nuevo jugador</h3>
    <div class="field"><label for="nm">Nombre o apodo</label><input id="nm" maxlength="16" required placeholder="Ej.: Lucía, Capitán Tiza…" autocomplete="off"></div>
    <div class="field"><span>Avatar</span><div class="avpick">${AVATARS_FREE.map(e=>`<button type="button" data-a="${e}" aria-pressed="${e===av}">${e}</button>`).join('')}</div></div>
    <button class="btn primary" type="submit">Crear y jugar</button></form>
   ${ps.length?'':`<div class="panel grid" style="max-width:520px"><h3>¿Ya tenías partida?</h3><div class="field"><label for="imp2">Pega tu código de copia de seguridad</label><textarea id="imp2" rows="2"></textarea></div><button class="btn" id="impB2" style="justify-self:start">Recuperar partida</button></div>`}</section>`;
  $$('.pcard',app).forEach(b=>b.onclick=()=>{DB.current=b.dataset.id;save();go('home')});
  $$('.avpick button',app).forEach(b=>b.onclick=()=>{av=b.dataset.a;$$('.avpick button',app).forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#nf').onsubmit=e=>{e.preventDefault();const n=$('#nm').value.trim();if(!n)return;newProfile(n,av);go('home')};
  const ib=$('#impB2');if(ib)ib.onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#imp2').value.trim()))));if(!d||!d.name||!d.story)throw 0;d.id=d.id||('p'+Date.now().toString(36));DB.profiles[d.id]=d;DB.current=d.id;save();go('home')}catch(e){toast('Ese código no es válido.')}};
},
};

/* ============ partida ============ */
function play(id,opts){
  stopRun();const g=GAMES[id];
  app.innerHTML=`<section class="screen"><div class="gamebar"><button class="btn ghost sm" id="quit">← Salir</button><h2>${g.icon} ${g.name}</h2>
    <span class="goal">${DIFS[opts.dif]}${opts.goal?' · Objetivo: '+opts.goal:''}</span><div class="hud" id="hud"></div></div>
   <div class="stage" id="stage"></div></section>`;
  const stage=$('#stage'),hud=$('#hud');
  $('#quit').onclick=()=>go(opts.mode==='story'?'historia':opts.mode==='daily'?'home':'libre');
  const c=makeCtx(stage,hud,{...opts,onEnd:res=>finish(id,opts,res)});RUN=c;
  stage.innerHTML=`<div class="center" style="min-height:340px;align-content:center"><div style="font-size:3.4rem">${g.icon}</div><p class="muted" style="max-width:46ch">${g.desc}</p><div class="qbig" id="cd">3</div></div>`;
  let n=3;beep(500,.1);const s=c.every(700,()=>{n--;if(n>0){$('#cd',stage).textContent=n;beep(500,.1)}else{s();beep(900,.15);stage.innerHTML='';g.run(c)}});
}
function finish(id,opts,res){
  const p=P();const g=GAMES[id];const score=res.score|0;
  p.played++;
  const bests=p.best[id]=p.best[id]||{};const prev=bests[opts.dif];const record=prev==null||score>prev;if(record)bests[opts.dif]=score;
  // estadísticas máximas para logros
  const st=res.stats||{};
  if(st.maxCombo)p.stats.maxCombo=Math.max(p.stats.maxCombo||0,st.maxCombo);
  if(st.apples)p.stats.apples=Math.max(p.stats.apples||0,st.apples);
  if(st.perfect)p.stats.perfect=true;
  if(id==='trivia'&&st.correct===10)p.stats.correct10=(p.stats.correct10||0)+1;
  if(st.rounds)p.stats.rounds=Math.max(p.stats.rounds||0,st.rounds);
  let coins=Math.floor(score/10),xp=Math.round(score/2)+10;let extra='';let stars=null,passed=null;
  const lvBefore=levelOf(p.xp);
  if(opts.mode==='story'){const i=opts.chapter;stars=starsFor(score,opts.goal);passed=stars>0;
    const old=p.story.stars[i]||0;if(stars>old){coins+=(stars-old)*15;p.story.stars[i]=stars}
    if(passed&&p.story.done===i){p.story.done=i+1;coins+=25;xp+=50;extra='¡Capítulo desbloqueado!'}}
  if(opts.mode==='daily'){passed=score>=opts.goal;if(passed&&p.dailyDone!==today()){p.dailyDone=today();p.dailyCount++;coins+=50;extra='Reto del día completado: +50 🪙'}}
  p.coins+=coins;p.xp+=xp;
  const lvUp=levelOf(p.xp)>lvBefore;
  const nw=checkAchs(p);save();renderChips();
  (passed===false?sfx.ko:sfx.win)();
  const title=passed===false?'¡Casi!':record&&prev!=null?'¡Nuevo récord!':'¡Bien jugado!';
  const starHtml=stars!=null?`<div class="stars" style="font-size:2.2rem">${[1,2,3].map(k=>`<span class="${k<=stars?'on':'off'}">★</span>`).join('')}</div>`:'';
  const goalTxt=opts.goal?`<p class="muted" style="margin:0">${passed?'Objetivo superado':'Necesitabas '+opts.goal+'. ¡Inténtalo otra vez!'}</p>`:'';
  const btns={again:()=>play(id,opts),back:()=>go(opts.mode==='story'?'historia':opts.mode==='daily'?'home':'libre')};
  let main=`<button class="btn primary" data-x="again">Repetir</button>`;
  if(opts.mode==='story'&&passed){btns.next=()=>showOutro(opts.chapter);main=`<button class="btn primary" data-x="next">Continuar la historia</button><button class="btn ghost" data-x="again">Repetir</button>`}
  modal(`<div class="eyebrow">${g.icon} ${g.name}</div><h2>${title}</h2><div class="score">${score}</div>${starHtml}${goalTxt}
    <div class="rewards"><span class="chip">+${xp} XP</span><span class="chip">+${coins} 🪙</span>${prev!=null?`<span class="chip">Récord: ${Math.max(prev,score)}</span>`:''}</div>
    ${lvUp?`<div class="newach">⬆️ ¡Subes a nivel ${levelOf(p.xp)}!</div>`:''}${extra?`<div class="newach">${extra}</div>`:''}
    ${nw.map(a=>`<div class="newach">${a.i} Logro desbloqueado: ${a.n}</div>`).join('')}
    <div class="row">${main}<button class="btn ghost" data-x="back">Salir</button></div>`,btns);
}
function showOutro(i){
  const s=STORY[i];const last=i===STORY.length-1;
  app.innerHTML=`<section class="screen story-box"><div class="eyebrow">Capítulo ${i+1} completado</div><h1 class="big-title" style="font-size:2.4rem">${s.t}</h1><p>${s.outro}</p>
   <div class="row" style="justify-content:flex-start">${last?'<button class="btn primary" id="n">Ver el final</button>':'<button class="btn primary" id="n">Siguiente capítulo</button>'}<button class="btn ghost" id="m">Mapa</button></div></section>`;
  $('#n').onclick=()=>last?go('final'):go('intro',i+1);$('#m').onclick=()=>go('historia');window.scrollTo(0,0);
}
function modal(html,actions){
  closeModal();const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);$$('[data-x]',bg).forEach(b=>b.onclick=()=>{const f=actions[b.dataset.x];closeModal();f&&f()});
  const f=$('[data-x]',bg);f&&f.focus();
}
function closeModal(){$$('.modal-bg').forEach(m=>m.remove())}

/* ============ arranque ============ */
load();
go(P()?'home':'perfiles');
</script>
</body>
</html>
