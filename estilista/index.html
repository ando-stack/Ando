<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Percha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: un probador. Arriba la semana como fila de días; cada día es un perchero con etiquetas de precio colgadas. */
:root{
  --bg:#F2F2F5; --surface:#FFFFFF; --ink:#18171D; --muted:#686673; --line:#DEDDE5; --tile:#ECECF1;
  --accent:#2A44D4; --accent-ink:#FFFFFF; --accent-soft:#E5E8FB;
  --sport:#12784F; --sport-soft:#DDF2E8; --warn:#A84A16; --warn-soft:#FBE9DD;
  --ico-stroke:#2A2930;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111115; --surface:#1A1A20; --ink:#EDECF2; --muted:#A3A1AE; --line:#2E2D37; --tile:#26262E;
    --accent:#8C9CFF; --accent-ink:#0E1030; --accent-soft:#232848;
    --sport:#5BCB98; --sport-soft:#173A2A; --warn:#F2A374; --warn-soft:#3D2416;
    --ico-stroke:#D9D8E0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111115; --surface:#1A1A20; --ink:#EDECF2; --muted:#A3A1AE; --line:#2E2D37; --tile:#26262E;
  --accent:#8C9CFF; --accent-ink:#0E1030; --accent-soft:#232848;
  --sport:#5BCB98; --sport-soft:#173A2A; --warn:#F2A374; --warn-soft:#3D2416;
  --ico-stroke:#D9D8E0; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 8px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .count{font-family:var(--f-mono);font-size:12px;margin-left:4px;opacity:.8}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* resumen */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-block:14px 8px}
.summary > div{background:var(--surface);padding:12px 16px;min-width:0}
.summary .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.summary .val{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.summary .val.ok{color:var(--sport)}
.summary .val.over{color:var(--warn)}
.summary .act{display:flex;align-items:center;justify-content:center}
@media (max-width:760px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.summary .act{grid-column:1/-1}}

/* semana */
.weekbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-block:14px 6px}
.weekbar button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.weekbar b{font-family:var(--f-display);font-size:18px}
.weekbar small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.weekbar button.off{opacity:.4;cursor:default}
.weekbar button.sport{border-color:var(--sport)}
.weekbar button.sport small{color:var(--sport);font-weight:600}
.weekbar button.today{box-shadow:inset 0 -3px 0 var(--accent)}

.day{padding-block:26px 4px;border-top:1px solid var(--line);scroll-margin-top:12px}
.day:first-of-type{border-top:0}
.day-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.day-head h3{font-size:34px;font-weight:800;letter-spacing:-.02em}
.day-head .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tile);color:var(--muted);letter-spacing:.02em}
.chip.sport{background:var(--sport-soft);color:var(--sport)}
.chip.today{background:var(--accent-soft);color:var(--accent)}
.day-total{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tip{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0;max-width:68ch;font-size:14px}
.tip b{font-weight:700}
.kit{margin-top:18px}
.kit h4{font-size:15px;font-family:var(--f-body);font-weight:700;color:var(--sport);margin-bottom:10px;display:flex;gap:8px;align-items:center}

/* etiquetas de prenda */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tag{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tag::before{content:"";position:absolute;top:10px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tag.have{border-style:dashed}
.tag-top{display:flex;gap:12px;align-items:flex-start;min-width:0}
.ico{flex:none;width:58px;height:58px;border-radius:10px;background:var(--tile);display:grid;place-items:center}
.ico svg{width:46px;height:46px}
.tag-info{min-width:0;display:flex;flex-direction:column;gap:1px;padding-right:12px}
.role{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag-name{font-family:var(--f-body);font-size:14.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.store{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.price{font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.tag.have .price{text-decoration:line-through;color:var(--muted);font-size:13px}
.tag-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.buy{display:flex;justify-content:center;align-items:center;gap:6px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;font-size:13.5px;padding:8px 10px;border-radius:9px}
.buy:hover{filter:brightness(1.15)}
.havebadge{display:flex;justify-content:center;align-items:center;gap:6px;background:var(--sport-soft);color:var(--sport);font-weight:700;font-size:13.5px;padding:8px 10px;border-radius:9px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.nope{border:0;background:none;padding:0;text-align:left;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.nope:hover{color:var(--warn)}
.check input{width:17px;height:17px;accent-color:var(--sport);margin:0;flex:none}

/* listas */
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:28px 12px}
.section-title h2{font-size:26px;font-weight:800;letter-spacing:-.01em}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ico{width:52px;height:52px}
.row .ico svg{width:40px;height:40px}
.row .price{text-align:right}
.row-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.row{grid-template-columns:52px minmax(0,1fr) auto}.row-actions{grid-column:2/-1;justify-content:flex-start}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted)}

/* formulario armario */
.addform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.addform label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.addform input,.addform select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;font-size:14px;width:100%;min-width:0}
@media (max-width:700px){.addform{grid-template-columns:1fr 1fr}.addform label:first-child{grid-column:1/-1}.addform .btn{grid-column:1/-1}}

/* respuestas */
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.answers > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.answers dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.answers dd{margin:4px 0 0;font-weight:600}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:12px;font-weight:600}

/* cuestionario */
.wizard{max-width:720px;margin:0 auto;padding-block:28px}
.wiz-intro{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.wiz-intro h1{font-size:clamp(34px,7vw,52px);font-weight:800;letter-spacing:-.03em}
.wiz-intro p{margin:0;color:var(--muted);max-width:56ch;font-size:16px}
.progress{display:flex;gap:4px;margin-bottom:14px}
.progress i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.progress i.on{background:var(--accent)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.qstep{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.qcard h2{font-size:clamp(24px,4.5vw,32px);font-weight:700;letter-spacing:-.015em;margin:6px 0 4px}
.qhelp{margin:0 0 18px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt b{font-size:15.5px}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] b{color:var(--accent)}
.dayopts{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayopt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 2px;display:flex;flex-direction:column;align-items:center;min-width:0}
.dayopt b{font-family:var(--f-display);font-size:20px}
.dayopt span{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dayopt.sportsel[aria-pressed="true"]{border-color:var(--sport);background:var(--sport-soft);color:var(--sport)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sub{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.sub h3{font-family:var(--f-body);font-size:16px;font-weight:700;margin-bottom:10px}
.money{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.money label{font-weight:600;font-size:14px}
.money .field{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px}
.money input{border:0;background:transparent;width:110px;padding:10px 4px;font-family:var(--f-mono);font-size:18px}
.money input:focus{outline:none}
.money .field:focus-within{border-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px 6px 6px;font-size:14px;font-weight:600}
.sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(128,128,128,.45)}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.qerr{color:var(--warn);font-weight:600;font-size:14px;min-height:21px;margin-top:10px}

.foot{margin-top:40px;color:var(--muted);font-size:13px;max-width:72ch}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}html{scroll-behavior:auto}}
@media (max-width:520px){.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;border-radius:14px}.tabs button{padding:7px 2px;font-size:13px;border-radius:10px}.tabs .count{display:none}.buy .long{display:none}.day-head h3{font-size:28px}.tags{grid-template-columns:1fr 1fr;gap:8px}.tag{padding:10px}.ico{width:46px;height:46px}.ico svg{width:38px;height:38px}.tag-top{flex-direction:column;gap:8px}.tag-info{padding-right:0}.qcard{padding:18px}.dayopt b{font-size:17px}}
</style>
</head>

<div class="wrap" id="app"></div>

];

};
const AVOID = [
  ['shorts','Pantalón corto','Bermudas, shorts y pantalón corto de deporte', it => (it.cat === 'bottom' || it.cat === 'sbot') && /bermuda|short|corto|biker/i.test(it.name)],

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function seasonOk(it, w){
  const s = it.season;

  if (w === 'calor') return s === 'c';
  if (w === 'templado') return s === 't';
  return s === 't' || s === 'f';

function scheduleOf(a){
  const isSport = d => a.sport && a.sportDays.includes(d);
  const show = DAYS.map(d => d.k).filter(d => a.days.includes(d) || isSport(d));
  const main = show.filter(d => !isSport(d) || a.sportMode === 'change');
  const sport = show.filter(isSport);

const WEIGHT = {top:1, dress:1.6, bottom:1.5, outer:2.4, shoes:2.6, acc:.6, stop:.5, sbot:.7, sshoe:1.8, sout:1};
const MAIN_CATS = ['top','dress','bottom','outer','shoes','acc'];
const SPORT_CATS = ['stop','sbot','sshoe','sout'];

function generatePlan(a, seed){
  const rng = mulberry32(seed);
  const sch = scheduleOf(a);
  const nM = sch.main.length, nS = sch.sport.length, w = a.weather;
  const slots = [];
  const add = (cat, req) => slots.push({cat, req});
  if (nM){ add('top',1); add('bottom',1); add('shoes',1); if (w === 'frio') add('outer',1); }
  if (nS){ add('stop',1); add('sbot',1); }
  if (nM){
    // primero variedad: camisetas y pantalones intercalados
    const nTops = Math.min(nM, 5), nBot = nM <= 2 ? 1 : nM <= 4 ? 2 : 3;
    const dress = a.gender !== 'h' && nM >= 3;
    const extraTops = nTops - 1 - (dress ? 1 : 0), extraBots = nBot - 1;
    for (let i = 0; i < Math.max(extraTops, extraBots); i++){
      if (i < extraTops) add('top',0);
      if (i < extraBots) add('bottom',0);
    }
    if (dress) add('dress',0);
    if (w === 'templado') add('outer',0);
  }
  // si no llega para zapatillas de deporte, se usan las de diario
  if (nS) add('sshoe', nM ? 0 : 1);
  if (nS && w !== 'calor') add('sout',0);
  if (nS >= 2) add('stop',0);
  if (nS >= 3) add('sbot',0);
  if (nM >= 4) add('shoes',0);
  if (nM) add('acc',0);
  if (nM && a.budget >= 300) add('acc',0);

  // primero lo que ya tienes: no cuesta nada
  const picks = [];
  const relevant = it => (MAIN_CATS.includes(it.cat) && nM) || (SPORT_CATS.includes(it.cat) && nS);
  const owned = allItems().filter(it => S.owned[it.id] && relevant(it) && seasonOk(it, w));
  owned.forEach(it => {
    let idx = slots.findIndex(s => s.cat === it.cat);
    if (idx < 0 && it.cat === 'dress') idx = slots.findIndex(s => s.cat === 'top' && !s.req);
    if (idx >= 0) slots.splice(idx, 1);
    picks.push(it);
  });

  const ordered = slots.filter(s => s.req).concat(slots.filter(s => !s.req));
  let remaining = a.budget;
  const picked = new Set(picks.map(p => p.id));
  const firstWord = it => it.name.split(' ')[0].toLowerCase();

  function score(it, cap){
    let s = 0;
    const ov = it.st.filter(x => a.styles.includes(x)).length;
    s += ov ? 2.5 + ov * 1.2 : -5;
    if (a.colors.length && COLORS[it.color] && a.colors.includes(COLORS[it.color][3])) s += 1.6;
    s += Math.min(it.price / Math.max(cap, 1), 1) * 1.2;
    s += rng() * 1.8;
    if (/básic/i.test(it.name) && MAIN_CATS.includes(it.cat)) s -= 1;
    if (it.st.includes('ath') && !a.styles.includes('ath') && MAIN_CATS.includes(it.cat)) s -= 1.5;
    const same = picks.filter(p => p.cat === it.cat);
    if (same.some(p => p.color === it.color)) s -= 2.2;
    if (same.some(p => firstWord(p) === firstWord(it))) s -= 1.2;
    if (!isNeutral(it.color)){
      const loud = picks.filter(p => ['top','dress','bottom','outer'].includes(p.cat) && !isNeutral(p.color)).length;
      s -= loud * 0.9;
      if (it.cat === 'bottom' && !picks.some(p => p.cat === 'bottom' && isNeutral(p.color))) s -= 3;
      if (it.cat === 'shoes' && !picks.some(p => p.cat === 'shoes' && isNeutral(p.color))) s -= 3;
    }
    picks.filter(p => p.store === it.store).forEach(() => { s -= 0.25; });
    return s;
  }

  // precio mínimo de cada tipo de prenda, para reservar dinero y que haya variedad
  const minPrice = {};
  ordered.forEach(sl => {
    if (minPrice[sl.cat] != null) return;
    const ps = CATALOG.filter(it => it.cat === sl.cat && genderOk(it, a) && seasonOk(it, w) && allowed(it, a)).map(it => it.price);
    minPrice[sl.cat] = ps.length ? Math.min(...ps) : 0;
  });
  ordered.forEach((slot, k) => {
    const restW = ordered.slice(k).reduce((t, s) => t + WEIGHT[s.cat], 0);
    const reserve = slot.req ? ordered.slice(k + 1).filter(s => s.req).reduce((t, s) => t + minPrice[s.cat], 0) : 0;
    const limit = Math.max(remaining - reserve, 0);
    const cap = remaining * WEIGHT[slot.cat] / restW;
    const cands = CATALOG.filter(it => it.cat === slot.cat && genderOk(it, a) && seasonOk(it, w) && allowed(it, a) && !picked.has(it.id));
    if (!cands.length) return;
    const scored = cands.map(it => ({it, s: score(it, cap)}));
    const pool = scored.filter(x => x.it.price <= Math.min(cap * 1.5, limit));
    let choice = null;
    if (pool.length) choice = pool.reduce((b, x) => x.s > b.s ? x : b);
    else if (slot.req || ['top','bottom','dress'].includes(slot.cat)){
      // no llega: lo más barato, y entre precios parecidos el que más pega con tu estilo
      const minP = Math.min(...scored.map(x => x.it.price));
      const cheap = scored.filter(x => x.it.price <= minP * 1.2 + 2);
      choice = cheap.reduce((b, x) => x.s > b.s ? x : b);
    }
    if (!choice || (!slot.req && choice.it.price > remaining)) return;
    picks.push(choice.it); picked.add(choice.it.id); remaining -= choice.it.price;
  });

  // días de deporte sin zapatillas: si no hay unas de diario que valgan, las más baratas de deporte
  const sneaker = x => (x.cat === 'sshoe') || (x.cat === 'shoes' && iconKind(x) === 'shoe' && !/derby|bailarinas|merceditas|mocas|náutico|sandalias|plataforma/i.test(x.name));
  if (nS && !picks.some(sneaker)){
    const c = CATALOG.filter(it => it.cat === 'sshoe' && genderOk(it, a) && allowed(it, a)).sort((x, y) => x.price - y.price)[0];
    if (c) picks.push(c);
  }
  return {seed, items: picks.map(p => p.id), preOwned: picks.filter(p => S.owned[p.id]).map(p => p.id), shifts: {}, created: Date.now()};
}

// ---------- la estilista: combinar por días ----------
function wardrobe(plan){
  const W = {top:[], bottom:[], shoes:[], outer:[], acc:[], stop:[], sbot:[], sshoe:[], sout:[]};
  plan.items.map(byId).filter(Boolean).forEach(it => {
    const c = it.cat === 'dress' ? 'top' : it.cat;
    if (W[c]) W[c].push(it);
  });
  return W;
}
const rot = (arr, n) => arr.length ? arr.slice(n % arr.length).concat(arr.slice(0, n % arr.length)) : arr;
const clash = (x, y) => x && y && !isNeutral(x.color) && !isNeutral(y.color);

function mainOutfit(W, i, s, used, a){
  if (!W.top.length) return null;
  const tops = rot(W.top, i + s), bots = rot(W.bottom, i + s);
  let best = null, fallback = null;
  for (const t of tops){
    const options = t.cat === 'dress' || !bots.length ? [null] : bots;
    for (const b of options){
      if (clash(t, b)) continue;
      const key = t.id + '|' + (b ? b.id : '');
      if (!fallback) fallback = {t, b, key};
      if (!used.has(key)){ best = {t, b, key}; break; }
    }
    if (best) break;
  }
  const pick = best || fallback || {t: tops[0], b: bots[0] || null, key: tops[0].id};
  const lead = [pick.t, pick.b].find(x => x && !isNeutral(x.color));
  const shoes = rot(W.shoes, i + s).find(x => !clash(x, lead)) || W.shoes[0] || null;
  const outer = a.weather !== 'calor' ? (rot(W.outer, i + s).find(x => !clash(x, lead)) || W.outer[0] || null) : null;
  const acc = W.acc.length && (i + s) % 2 === 0 ? rot(W.acc, Math.floor((i + s) / 2))[0] : null;
  return {key: pick.key, pieces: [outer, pick.t, pick.b, shoes, acc].filter(Boolean).map(x => x.id)};
}
function sportKit(W, j, s, a){
  const pieces = [
    a.weather !== 'calor' ? rot(W.sout, j + s)[0] : null,
    rot(W.stop, j + s)[0], rot(W.sbot, j + s)[0],
    rot(W.sshoe, j + s)[0] || W.shoes.find(x => iconKind(x) === 'shoe' && !/derby|bailarinas|merceditas|mocas|náutico|sandalias|plataforma/i.test(x.name))
  ].filter(Boolean).map(x => x.id);
  return pieces.length ? {pieces} : null;
}

function tipFor(day, outfit, idx, a){
  if (outfit){
    const loud = outfit.pieces.map(byId).filter(x => x && !isNeutral(x.color) && x.cat !== 'acc' && x.cat !== 'shoes')[0];
    if (loud && idx % 2 === 0) return 'El color lo pone tu <b>' + esc(loud.name.toLowerCase()) + '</b>. El resto en neutros para que destaque.';
    const st = a.styles[idx % a.styles.length];
    const list = TIPS[st] || TIPS.cas;
    return list[(idx + (S.plan.seed % 7)) % list.length];
  }
  return TIPS.sport[idx % TIPS.sport.length];
}

function buildWeek(){
  const a = S.answers, plan = S.plan, W = wardrobe(plan), sch = scheduleOf(a);
  const out = {};
  const used = new Set();
  // primera pasada: sin cambios, evitando repetir la misma combinación
  sch.show.forEach(d => {
    const mi = sch.main.indexOf(d), si = sch.sport.indexOf(d);
    const main = mi >= 0 ? mainOutfit(W, mi, 0, used, a) : null;
    if (main) used.add(main.key);
    out[d] = {main, kit: si >= 0 ? sportKit(W, si, 0, a) : null, mi, si};
  });
  // días con "otra combinación"
  sch.show.forEach(d => {
    const sh = plan.shifts[d] || 0;
    if (!sh) return;
    const o = out[d];
    const others = new Set(sch.show.filter(x => x !== d && out[x].main).map(x => out[x].main.key));
    if (o.mi >= 0) o.main = mainOutfit(W, o.mi, sh, others, a);
    if (o.si >= 0) o.kit = sportKit(W, o.si, sh, a);
  });
  sch.show.forEach((d, n) => {
    const o = out[d];
    o.sport = sch.isSport(d);
    o.tip = tipFor(d, o.main, n + (plan.shifts[d] || 0), a);
    if (o.main && o.kit) o.tip2 = TIPS.change[n % TIPS.change.length];
  });
  return out;
}

function iconKind(it){
  const n = it.name.toLowerCase();
  if (it.cat === 'dress') return 'dress';
  if (it.cat === 'shoes' || it.cat === 'sshoe') return /bota|botin|botín|martens|1460/.test(n) ? 'boot' : 'shoe';
  if (it.cat === 'acc'){
    if (/gorra/.test(n)) return 'cap';
    if (/gorro/.test(n)) return 'beanie';
    if (/bolso|mochila|tote|bandolera/.test(n)) return 'bag';
    if (/bufanda|pañuelo/.test(n)) return 'scarf';
    return 'jewel';
  }
  if (it.cat === 'bottom' || it.cat === 'sbot'){
    if (/falda/.test(n)) return 'skirt';
    if (/bermuda|short|corto|biker/.test(n)) return 'shorts';
    return 'pants';
  }
  if (it.cat === 'outer' || it.cat === 'sout'){
    if (/abrigo|gabardina|parka/.test(n)) return 'coat';
    if (/sudadera/.test(n)) return 'hoodie';
    if (/chaleco/.test(n)) return 'vest';
    return 'jacket';
  }
  if (/capucha/.test(n)) return 'hoodie';
  if (/chaleco/.test(n)) return 'vest';
  if (/jersey|sudadera|cárdigan|manga larga|henley|térmica|body/.test(n)) return 'sweater';
  if (/camisa|blusa|polo/.test(n)) return 'shirt';
  if (/tirantes|top|corsé/.test(n)) return 'tank';
  return 'tee';
}

  const days = list => list.length ? DAYS.filter(d => list.includes(d.k)).map(d => d.n).join(', ') : '—';
  return [
    ['Ropa de', {m:'Mujer', h:'Hombre', x:'De todo'}[a.gender]],
    ['Estilo', a.styles.map(s => STYLES[s].n).join(', ')],
    ['Presupuesto', euro(a.budget)],
    ['Días con outfit', days(a.days)],
    ['Deporte / EF', a.sport ? days(a.sportDays) + (a.sportMode === 'change' ? ' (te cambias)' : ' (vas en ropa de deporte)') : 'No'],
    ['Tiempo', {calor:'Calor', templado:'Entretiempo', frio:'Frío'}[a.weather]],
    ['No te pones', (a.avoid || []).length ? a.avoid.map(k => AVOID.find(x => x[0] === k)[1]).join(', ') : 'Nada que evitar'],
    ['Colores favoritos', a.colors.length ? a.colors.map(c => COLOR_GROUPS.find(g => g[0] === c)[1]).join(', ') : 'Sin preferencia']
  ];
}
function renderAnswers(){
  let h = '<div class="section-title"><h2>Mis respuestas</h2><button class="btn" data-action="edit">Cambiar respuestas</button></div>';
  h += '<dl class="answers">' + answerText(S.answers).map(([k, v]) => '<div><dt>' + k + '</dt><dd>' + esc(v) + '</dd></div>').join('') + '</dl>';
  h += '<div class="section-title"><h2>Empezar de cero</h2></div>';
  h += confirmReset
    ? '<div class="confirm">Se borran respuestas, outfits y armario. ¿Seguro? <button class="btn small danger" data-action="reset-yes">Sí, borrar todo</button><button class="btn small" data-action="reset-no">Cancelar</button></div>'
    : '<button class="btn danger" data-action="reset">Borrar todo</button>';
  return h;
}

// ---------- cuestionario ----------
function defaultWeather(){ const m = new Date().getMonth(); return [5,6,7,8].includes(m) ? 'calor' : [10,11,0,1,2].includes(m) ? 'frio' : 'templado'; }
function newDraft(){
  const d = S.answers ? JSON.parse(JSON.stringify(S.answers)) :
    {gender:null, styles:[], budget:null, days:['lun','mar','mie','jue','vie'], sport:null, sportDays:[], sportMode:'all', weather:defaultWeather(), colors:[], avoid:[]};
  if (!d.avoid) d.avoid = [];
  return d;
}
const STEPS = [
  {q:'¿Para quién es la ropa?', help:'Así te enseño los cortes que buscas. Lo unisex sale siempre.',
   ok:w => !!w.gender, err:'Elige una opción.',
   body:w => '<div class="opts">' + [['m','Mujer','Ropa de mujer y unisex'],['h','Hombre','Ropa de hombre y unisex'],['x','De todo','Enséñame todo el catálogo']].map(([k, n, d]) =>
     '<button class="opt" data-set="gender" data-val="' + k + '" aria-pressed="' + (w.gender === k) + '"><b>' + n + '</b><span>' + d + '</span></button>').join('') + '</div>'},
  {q:'¿Qué estilo te gusta?', help:'Elige hasta tres. Mezclarlos da looks con más personalidad.',
   ok:w => w.styles.length > 0, err:'Elige al menos un estilo.',
   body:w => '<div class="opts">' + Object.keys(STYLES).map(k =>
     '<button class="opt" data-toggle="styles" data-val="' + k + '" data-max="3" aria-pressed="' + w.styles.includes(k) + '"><b>' + STYLES[k].n + '</b><span>' + STYLES[k].d + '</span></button>').join('') + '</div>'},
  {q:'¿Cuánto quieres gastarte?', help:'Es el total para toda la semana. Lo que ya tengas en tu armario no cuenta.',
   ok:w => w.budget >= 20, err:'Pon un presupuesto de 20 € o más.',
   body:w => '<div class="opts">' + [[60,'Ajustado'],[120,'Normal'],[200,'Holgado'],[350,'Me doy un capricho'],[600,'Renovar el armario']].map(([v, n]) =>
     '<button class="opt" data-set="budget" data-val="' + v + '" data-num="1" aria-pressed="' + (w.budget === v) + '"><b class="mono">' + euro(v) + '</b><span>' + n + '</span></button>').join('') + '</div>' +
     '<div class="money"><label for="budget-in">Otra cantidad</label><span class="field"><input id="budget-in" type="number" inputmode="numeric" min="20" max="5000" step="5" value="' + (w.budget || '') + '" placeholder="150"><span class="mono">€</span></span></div>'},
  {q:'¿Para qué días quieres outfit?', help:'Te los ordeno de lunes a domingo.',
   ok:w => w.days.length > 0, err:'Elige al menos un día.',
   body:w => dayPicker('days', w.days, '') + '<div class="presets"><button class="btn small" data-preset="week">Entre semana</button><button class="btn small" data-preset="all">Toda la semana</button><button class="btn small" data-preset="weekend">Solo finde</button></div>'},
  {q:'¿Haces deporte o tienes educación física?', help:'Los días de deporte te preparo ropa deportiva.',
   ok:w => w.sport === false || (w.sport === true && w.sportDays.length > 0), err:'Dime qué días haces deporte.',
   body:w => '<div class="opts">' + [[true,'Sí','Tengo EF o voy a entrenar'],[false,'No','Solo ropa de diario']].map(([v, n, d]) =>
     '<button class="opt" data-set="sport" data-val="' + v + '" data-bool="1" aria-pressed="' + (w.sport === v) + '"><b>' + n + '</b><span>' + d + '</span></button>').join('') + '</div>' +
     (w.sport ? '<div class="sub"><h3>¿Qué días?</h3>' + dayPicker('sportDays', w.sportDays, ' sportsel') +
       '</div><div class="sub"><h3>Esos días…</h3><div class="opts">' +
       [['all','Voy en ropa de deporte todo el día','Te pongo un conjunto deportivo completo'],['change','Me cambio para la clase','Outfit normal y aparte la bolsa de deporte']].map(([k, n, d]) =>
         '<button class="opt" data-set="sportMode" data-val="' + k + '" aria-pressed="' + (w.sportMode === k) + '"><b>' + n + '</b><span>' + d + '</span></button>').join('') + '</div></div>' : '')},
  {q:'¿Qué tiempo hace donde vives?', help:'Para saber si hace falta abrigo. Lo he elegido según la fecha de hoy.',
   ok:w => !!w.weather, err:'Elige una opción.',
   body:w => '<div class="opts">' + [['calor','Calor','Manga corta, nada de abrigo'],['templado','Entretiempo','Una chaqueta ligera'],['frio','Frío','Abrigo y punto']].map(([k, n, d]) =>
     '<button class="opt" data-set="weather" data-val="' + k + '" aria-pressed="' + (w.weather === k) + '"><b>' + n + '</b><span>' + d + '</span></button>').join('') + '</div>'},
  {q:'¿Hay algo que no te pondrías?', help:'Marca todo lo que no quieras ver. Nunca te lo pondré, tampoco para deporte.',
   ok:() => true,
   body:w => '<div class="opts">' + AVOID.map(([k, n, d]) =>
     '<button class="opt" data-toggle="avoid" data-val="' + k + '" aria-pressed="' + w.avoid.includes(k) + '"><b>' + n + '</b><span>' + (d || '&nbsp;') + '</span></button>').join('') + '</div>'},
  {q:'¿Qué colores te gustan más?', help:'Opcional. Les daré prioridad, sin dejar de combinar.',
   ok:() => true,
   body:w => '<div class="swatches">' + COLOR_GROUPS.map(([k, n, hex]) =>
     '<button class="sw" data-toggle="colors" data-val="' + k + '" aria-pressed="' + w.colors.includes(k) + '"><i style="background:' + hex + '"></i>' + n + '</button>').join('') + '</div>'}
];
function dayPicker(field, sel, extra){
  return '<div class="dayopts">' + DAYS.map(d =>
    '<button class="dayopt' + extra + '" data-toggle="' + field + '" data-val="' + d.k + '" aria-pressed="' + sel.includes(d.k) + '" aria-label="' + d.n + '"><b>' + d.s + '</b><span>' + d.n.slice(0, 3) + '</span></button>').join('') + '</div>';
}
let step = 0, wizErr = '';
function renderWizard(){
  if (!wiz) wiz = newDraft();
  const st = STEPS[step], last = step === STEPS.length - 1;
  let h = '<div class="wizard"><div class="wiz-intro"><h1>Percha</h1><p>Soy tu estilista. Te hago ocho preguntas y te monto los outfits de la semana, con la tienda, el precio y dónde comprar cada prenda.</p></div>' +
    '<div class="progress" aria-hidden="true">' + STEPS.map((_, i) => '<i class="' + (i <= step ? 'on' : '') + '"></i>').join('') + '</div>' +
    '<section class="qcard"><div class="qstep">Pregunta ' + (step + 1) + ' de ' + STEPS.length + '</div><h2>' + st.q + '</h2><p class="qhelp">' + st.help + '</p>' + st.body(wiz) +
    '<div class="qerr" role="alert">' + esc(wizErr) + '</div>' +
    '<div class="qnav">' + (step > 0 ? '<button class="btn" data-action="back">Atrás</button>' : (S.answers ? '<button class="btn ghost" data-action="cancel">Cancelar</button>' : '<span></span>')) +
    '<button class="btn primary" data-action="next">' + (last ? 'Crear mis outfits' : 'Siguiente') + '</button></div></section></div>';
  app.innerHTML = h;
}

// ---------- eventos ----------
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function newSeed(){ return (Math.random() * 2 ** 31) | 0; }
function rerender(focusId){ render(); if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); } }

app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (wiz){
    if (b.dataset.set){
      let v = b.dataset.val;
      if (b.dataset.num) v = +v;
      if (b.dataset.bool) v = v === 'true';
      wiz[b.dataset.set] = v; wizErr = '';
      if (b.dataset.set === 'sport' && v && !wiz.sportDays.length) wiz.sportDays = [];
      renderWizard();
      const again = app.querySelector('[data-set="' + b.dataset.set + '"][data-val="' + b.dataset.val + '"]'); if (again) again.focus();
      return;
    }
    if (b.dataset.toggle){
      const arr = wiz[b.dataset.toggle], v = b.dataset.val, i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1);
      else {
        const max = +b.dataset.max || 99;
        if (arr.length >= max) arr.shift();
        arr.push(v);
      }
      wizErr = ''; renderWizard();
      const again = app.querySelector('[data-toggle="' + b.dataset.toggle + '"][data-val="' + v + '"]'); if (again) again.focus();
      return;
    }
    if (b.dataset.preset){
      wiz.days = {week:['lun','mar','mie','jue','vie'], all:DAYS.map(d => d.k), weekend:['sab','dom']}[b.dataset.preset];
      wizErr = ''; renderWizard(); return;
    }
    const act = b.dataset.action;
    if (act === 'back'){ step--; wizErr = ''; renderWizard(); return; }
    if (act === 'cancel'){ wiz = null; step = 0; wizErr = ''; render(); return; }
    if (act === 'next'){
      if (step === 2){ const inp = document.getElementById('budget-in'); if (inp && inp.value) wiz.budget = Math.round(+inp.value); }
      const st = STEPS[step];
      if (!st.ok(wiz)){ wizErr = st.err; renderWizard(); return; }
      wizErr = '';
      if (step < STEPS.length - 1){ step++; renderWizard(); window.scrollTo(0, 0); return; }
      if (!wiz.sport){ wiz.sportDays = []; }
      S.answers = wiz; wiz = null; step = 0;
      S.plan = generatePlan(S.answers, newSeed()); S.tab = 'semana'; save(); render(); window.scrollTo(0, 0);
      toast('Listo: tus outfits de la semana');
      return;
    }
    return;
  }
  if (b.dataset.tab){ S.tab = b.dataset.tab; confirmReset = false; save(); render(); return; }
  if (b.dataset.jump){ const el = document.getElementById('dia-' + b.dataset.jump); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); return; }
  if (b.dataset.reroll){
    const d = b.dataset.reroll, before = JSON.stringify(buildWeek()[d]);
    let tries = 0, now;
    do { S.plan.shifts[d] = (S.plan.shifts[d] || 0) + 1; now = JSON.stringify(buildWeek()[d]); tries++; } while (now === before && tries < 8);
    save(); render();
    const again = app.querySelector('[data-reroll="' + d + '"]'); if (again) again.focus({preventScroll:true});
    toast(now === before ? 'No hay más combinaciones con estas prendas' : 'Nueva combinación para el ' + DAYS.find(x => x.k === d).n.toLowerCase());
    return;
  }
  if (b.dataset.ban){
    const id = b.dataset.ban, old = byId(id), a = S.answers;
    S.banned = S.banned || {}; S.banned[id] = true;
    const inPlan = new Set(S.plan.items);
    const cands = CATALOG.filter(x => x.cat === old.cat && !inPlan.has(x.id) && genderOk(x, a) && seasonOk(x, a.weather) && allowed(x, a));
    const fit = x => x.st.filter(t => a.styles.includes(t)).length * 2 - Math.abs(x.price - old.price) / 15;
    const best = cands.sort((x, y) => fit(y) - fit(x))[0];
    S.plan.items = S.plan.items.map(x => x === id ? (best ? best.id : null) : x).filter(Boolean);
    save(); render();
    toast(best ? 'Cambiado por: ' + best.name.toLowerCase() : 'Quitado. No hay otra prenda parecida');
    return;
  }
  if (b.dataset.remove){
    const id = b.dataset.remove;
    S.custom = S.custom.filter(x => x.id !== id); delete S.owned[id];
    if (S.plan) S.plan.items = S.plan.items.filter(x => x !== id);
    save(); render(); toast('Quitada de tu armario'); return;
  }
  const act = b.dataset.action;
  if (act === 'regen'){ S.plan = generatePlan(S.answers, newSeed()); save(); render(); toast('Nueva propuesta, usando lo que ya tienes'); return; }
  if (act === 'edit'){ wiz = newDraft(); step = 0; render(); window.scrollTo(0, 0); return; }
  if (act === 'reset'){ confirmReset = true; render(); return; }
  if (act === 'reset-no'){ confirmReset = false; render(); return; }
  if (act === 'reset-yes'){ confirmReset = false; S = blank(); save(); wiz = null; step = 0; render(); return; }
});

app.addEventListener('change', e => {
  const c = e.target.closest('input[data-own]');
  if (!c) return;
  const id = c.dataset.own, it = byId(id);
  if (c.checked) S.owned[id] = true; else delete S.owned[id];
  save(); rerender(c.id);
  toast(c.checked ? 'Apuntado: ya tienes ' + it.name.toLowerCase() : 'Quitada de tu armario');
});

app.addEventListener('submit', e => {
  if (e.target.id !== 'addform') return;
  e.preventDefault();
  const name = document.getElementById('add-name').value.trim();
  if (!name) return;
  const it = {id:'mia-' + Date.now().toString(36), name, cat:document.getElementById('add-cat').value, g:'u',
    st:(S.answers && S.answers.styles) || ['cas'], color:document.getElementById('add-color').value, price:0, store:'own', season:'', q:name, custom:true};
  S.custom.push(it); S.owned[it.id] = true; save(); render();
  toast('Añadida. Pulsa «Nueva propuesta» para que la use');
});

app.addEventListener('keydown', e => {
  if (wiz && e.key === 'Enter' && e.target.id === 'budget-in'){ e.preventDefault(); const n = app.querySelector('[data-action="next"]'); if (n) n.click(); }
});

render();
})();
</script>
