# Despliegue del frontend de ClassForge AI en Netlify.
# El backend (FastAPI) se despliega aparte (ver classforge/DESPLIEGUE.md).
[build]
  base = "classforge/frontend"
  command = "npm ci && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # NEXT_PUBLIC_API_URL se define en Netlify › Site configuration › Environment variables

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
