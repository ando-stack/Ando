# Despliegue en Netlify. El proyecto vive en la carpeta simulador-tenis del repositorio:
# en Netlify → Site configuration → Build & deploy, pon "Base directory" = simulador-tenis
# (Netlify leerá entonces este archivo).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: todas las rutas sirven index.html (los datos están en /data/*.json).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
