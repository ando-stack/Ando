# Ingesta programada del simulador de baloncesto (simulador-baloncesto/).
# Descarga los datos nuevos (con caché y límite de peticiones), regenera los snapshots, sube los datos a Supabase si hay secretos configurados y guarda los
# snapshots en el repositorio (lo que dispara un nuevo despliegue en Netlify).
# La recalibración (npm run calibrate) y el backtest (npm run backtest) se lanzan a mano.
name: simulador-ingesta

on:
  schedule:
    - cron: '17 7 * * *' # todos los días a las 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simulador-ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: simulador-baloncesto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simulador-baloncesto/package-lock.json
      - name: Caché de descargas
        uses: actions/cache@v4
        with:
          path: simulador-baloncesto/.cache
          key: ingesta-${{ github.run_id }}
          restore-keys: ingesta-
      - run: npm ci
      - name: Ingesta (EuroLiga, ACB, NBA)
        run: npx tsx ingest/run.ts all --skip-previous
      - name: Tests
        run: npm test
      - name: Subida a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx ingest/upload-supabase.ts all
      - name: Guardar snapshots
        run: |
          git config user.name "simulador-ingesta"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot data/games data/data_updates.json
          git diff --cached --quiet || git commit -m "Ingesta automática $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
