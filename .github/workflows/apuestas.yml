name: Cuota Justa · actualizar datos y publicar

on:
  schedule:
    - cron: "17 6,12,17 * * *"   # tres veces al día (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apuestas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos y entrenar el modelo
        run: python3 apuestas/actualizar_datos.py
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apuestas/web/datos.json
          git diff --cached --quiet || git commit -m "Cuota Justa: datos actualizados"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apuestas/web
      - id: deploy
        uses: actions/deploy-pages@v4
