# Desarrollo/self-hosting completo: Postgres local + API + worker + web.
# En producción con Supabase: quita "db", pon DATABASE_URL/STORAGE de Supabase en backend/.env.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fva }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/fva}
    volumes: [media:/data]
    ports: ["8000:8000"]
    depends_on: [db]
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.worker"]
    env_file: backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/fva}
    volumes: [media:/data]
    depends_on: [db]
  web:
    build:
      context: web
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, media: {} }
