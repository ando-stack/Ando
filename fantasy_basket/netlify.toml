# Netlify: base directory = fantasy_basket, sin comando de build, carpeta a publicar = "." (esta carpeta).
[build]
  publish = "."

# El código del scraper no se publica.
[[redirects]]
  from = "/scraper/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
