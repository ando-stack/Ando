<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Squad Victory — edición</title>
<style>
  /* Se maqueta sobre la imagen original (720x404) y se escala a 1280x720. */
  @font-face { font-family: "Archivo"; src: url("fonts/Archivo-Variable.ttf"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf"); font-weight: 100 900; }
  @font-face { font-family: "WorkSans"; src: url("fonts/WorkSans-Variable.ttf"); font-weight: 100 900; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  .lienzo { position: absolute; left: 0; top: 0; width: 720px; height: 404px; transform: scale(1.77778); transform-origin: 0 0;
    background: url("img/base_sin_personaje.png") 0 0 / 720px 404px no-repeat; }

  /* ====== textos: nombres en Archivo 900 inclinada 4° (como el original), número en Work Sans 900 recto ====== */
  /* letras "ORY" de VICTORY: por delante de la skin para que el título se lea entero */
  .ory { position: absolute; left: var(--ory-x, 488px); top: var(--ory-y, 7.5px); font-family: "Archivo"; font-weight: 900;
    font-stretch: var(--ory-ancho, 78%); font-size: var(--ory-tam, 93px); line-height: 1; letter-spacing: var(--ory-esp, 1px);
    background: linear-gradient(180deg, #fbfefb 20%, #eef2f6 85%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1.6px #f3f6f8;
    filter: drop-shadow(0 3px 0 rgba(25,0,30,.6)) drop-shadow(0 6px 8px rgba(25,0,30,.35)); }

  /* skin nueva (imagen aportada por el usuario) y la tarjeta del #1 por delante, como en el original */
  .skin { position: absolute; left: var(--skin-x, 350px); top: var(--skin-y, -8px); height: var(--skin-alto, 440px);
    filter: drop-shadow(-6px 8px 14px rgba(40,0,50,.45)); }
  .tarjeta { position: absolute; left: 8px; top: 106px; width: 458px; height: 77px; }

  .nombres { position: absolute; left: var(--n-left, 104px); top: var(--n-top, 121.6px); font-family: "Archivo";
    font-weight: 900; font-stretch: var(--n-ancho, 75%); font-size: var(--n-tam, 21.5px); line-height: var(--n-lh, 23px); color: #000;
    white-space: nowrap; letter-spacing: -0.2px; -webkit-text-stroke: var(--n-grueso, 0.35px) #000;
    transform: skewX(-4deg); transform-origin: 0 100%; }   /* el original va inclinado unos 4 grados */
  .nombres .amp { font-family: "Inter"; font-weight: 900; font-size: 0.97em; }   /* "&" clásico, como el original */
  .puntos { position: absolute; left: var(--p-left, 305px); top: var(--p-top, 118px); font-family: "WorkSans"; font-weight: 900;
    font-size: var(--p-tam, 52.4px); line-height: 1; color: #000; letter-spacing: -1px; -webkit-text-stroke: var(--p-grueso, 0.3px) #000; }

  .bandera { position: absolute; left: 403.5px; top: 124.5px; width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="lienzo">
  <img class="skin" src="img/skin_nueva_iluminada.png" alt="">
  <div class="ory">ORY</div>
  <img class="tarjeta" src="img/capa_tarjeta.png" alt="">
  <div class="nombres">ism4, PWR Tinka<br>PWR Zdog <span class="amp">&amp;</span> Crusades</div>
  <div class="puntos">100</div>

  <!-- bandera en diagonal: España arriba-izquierda, Australia abajo-derecha -->
  <svg class="bandera" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="circ"><circle cx="50" cy="50" r="49"/></clipPath>
      <clipPath id="tri-es"><polygon points="0,0 100,0 0,100"/></clipPath>
      <clipPath id="tri-au"><polygon points="100,0 100,100 0,100"/></clipPath>
      <clipPath id="canton"><rect x="52" y="50" width="36" height="26"/></clipPath>
      <radialGradient id="brillo" cx="32%" cy="26%" r="70%">
        <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".18"/>
      </radialGradient>
      <polygon id="estrella" points="0,-10 2.9,-4 9.5,-3.1 4.7,1.5 5.9,8.1 0,5 -5.9,8.1 -4.7,1.5 -9.5,-3.1 -2.9,-4"/>
    </defs>
    <g clip-path="url(#circ)">
      <!-- España (franjas horizontales 1:2:1) -->
      <g clip-path="url(#tri-es)">
        <rect x="0" y="0" width="100" height="100" fill="#AA151B"/>
        <rect x="0" y="25" width="100" height="50" fill="#F1BF00"/>
      </g>
      <!-- Australia -->
      <g clip-path="url(#tri-au)">
        <rect x="0" y="0" width="100" height="100" fill="#012169"/>
        <g clip-path="url(#canton)">
          <rect x="52" y="50" width="36" height="26" fill="#012169"/>
          <path d="M52 50 L88 76 M88 50 L52 76" stroke="#fff" stroke-width="6"/>
          <path d="M52 50 L88 76 M88 50 L52 76" stroke="#C8102E" stroke-width="2"/>
          <path d="M70 50 V76 M52 63 H88" stroke="#fff" stroke-width="8.5"/>
          <path d="M70 50 V76 M52 63 H88" stroke="#C8102E" stroke-width="5"/>
        </g>
        <use href="#estrella" transform="translate(68 89) scale(.75)" fill="#fff"/>
        <use href="#estrella" transform="translate(92 46) scale(.4)" fill="#fff"/>
        <use href="#estrella" transform="translate(88 86) scale(.4)" fill="#fff"/>
        <use href="#estrella" transform="translate(44 94) scale(.4)" fill="#fff"/>
      </g>
      <!-- línea diagonal de unión -->
      <path d="M100 0 L0 100" stroke="#fff" stroke-width="1.6" opacity=".9"/>
      <circle cx="50" cy="50" r="49" fill="url(#brillo)"/>
    </g>
  </svg>
</div>
</body>
</html>
