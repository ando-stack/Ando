<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Squad Victory — edición</title>
<style>
  /* Se maqueta sobre la imagen original (720x404) y se escala a 1280x720. */
  @font-face { font-family: "AB"; src: url("fonts/ArchivoBlack-Regular.ttf"); }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  .lienzo { position: absolute; left: 0; top: 0; width: 720px; height: 404px; transform: scale(1.77778); transform-origin: 0 0;
    background: url("img/base_sin_textos.png") 0 0 / 720px 404px no-repeat; }

  /* ====== textos de la tarjeta (posiciones medidas sobre el original) ====== */
  .nombre { position: absolute; left: 105px; font-family: "AB"; font-size: 23.6px; line-height: 1; color: #000;
    white-space: nowrap; transform-origin: 0 0; letter-spacing: -0.2px;
    -webkit-text-stroke: 0.45px #000; filter: blur(0.3px); }
  .l1 { top: var(--l1-top, 119px); transform: scaleX(var(--l1-ancho, .66)); }
  .l2 { top: var(--l2-top, 143px); transform: scaleX(.80); }
  .puntos { position: absolute; left: 305px; top: var(--p-top, 119px); font-family: "AB"; font-size: 51.5px; line-height: 1;
    color: #000; transform: scaleX(.88); transform-origin: 0 0; letter-spacing: -0.5px;
    -webkit-text-stroke: 0.6px #000; filter: blur(0.35px); }

  .bandera { position: absolute; left: 403.5px; top: 124.5px; width: 38px; height: 38px; filter: blur(0.25px); }
</style>
</head>
<body>
<div class="lienzo">
  <div class="nombre l1">ism4 PWR, Tinka PWR</div>
  <div class="nombre l2">Zdog &amp; Crusades</div>
  <div class="puntos">100</div>

  <!-- media bandera de España (izquierda) y media de Australia (derecha), en círculo -->
  <svg class="bandera" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="circ"><circle cx="50" cy="50" r="49"/></clipPath>
      <clipPath id="canton"><rect x="50" y="8" width="40" height="34"/></clipPath>
      <radialGradient id="brillo" cx="32%" cy="26%" r="70%">
        <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".18"/>
      </radialGradient>
      <polygon id="estrella" points="0,-10 2.9,-4 9.5,-3.1 4.7,1.5 5.9,8.1 0,5 -5.9,8.1 -4.7,1.5 -9.5,-3.1 -2.9,-4"/>
    </defs>
    <g clip-path="url(#circ)">
      <!-- España -->
      <rect x="0" y="0" width="50" height="100" fill="#AA151B"/>
      <rect x="0" y="25" width="50" height="50" fill="#F1BF00"/>
      <!-- Australia -->
      <rect x="50" y="0" width="50" height="100" fill="#012169"/>
      <g clip-path="url(#canton)">
        <rect x="50" y="8" width="40" height="34" fill="#012169"/>
        <path d="M50 8 L90 42 M90 8 L50 42" stroke="#fff" stroke-width="7"/>
        <path d="M50 8 L90 42 M90 8 L50 42" stroke="#C8102E" stroke-width="2.4"/>
        <path d="M70 8 V42 M50 25 H90" stroke="#fff" stroke-width="10"/>
        <path d="M70 8 V42 M50 25 H90" stroke="#C8102E" stroke-width="6"/>
      </g>
      <use href="#estrella" transform="translate(70 64) scale(1.05)" fill="#fff"/>
      <use href="#estrella" transform="translate(92 30) scale(.45)" fill="#fff"/>
      <use href="#estrella" transform="translate(84 52) scale(.45)" fill="#fff"/>
      <use href="#estrella" transform="translate(93 64) scale(.45)" fill="#fff"/>
      <use href="#estrella" transform="translate(86 84) scale(.5)" fill="#fff"/>
      <!-- línea de unión -->
      <rect x="49.3" y="0" width="1.4" height="100" fill="#fff" opacity=".9"/>
      <circle cx="50" cy="50" r="49" fill="url(#brillo)"/>
    </g>
  </svg>
</div>
</body>
</html>
